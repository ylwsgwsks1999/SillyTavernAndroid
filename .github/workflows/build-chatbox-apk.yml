name: Build Chatbox Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - '.github/workflows/build-chatbox-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull Git LFS payloads
        run: |
          git lfs install
          git lfs pull
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply Chatbox patch
        run: python3 tools/apply_chatbox_patch.py
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Chatbox-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
